name: Mirror image to public package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to mirror (default: preprod)"
        required: false
        default: "preprod"

env:
  SOURCE_IMAGE: ghcr.io/xdespujols/pilotua-frappe
  TARGET_IMAGE: ghcr.io/xdespujols/pilotua-frappe-public

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GHCR with PAT
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u xdespujols --password-stdin

      - name: Pull source image
        run: docker pull ${{ env.SOURCE_IMAGE }}:${{ inputs.tag }}

      - name: Create Dockerfile
        run: |
          cat > /tmp/Dockerfile <<'EOF'
          FROM ${{ env.SOURCE_IMAGE }}:${{ inputs.tag }}
          LABEL org.opencontainers.image.source="https://github.com/xdespujols/pilotua-frappe-public"
          LABEL org.opencontainers.image.title="pilotua-frappe-public"
          EOF

      - name: Build and push public image
        uses: docker/build-push-action@v6
        with:
          context: /tmp
          file: /tmp/Dockerfile
          push: true
          tags: |
            ${{ env.TARGET_IMAGE }}:${{ inputs.tag }}
            ${{ env.TARGET_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/xdespujols/pilotua-frappe-public
            org.opencontainers.image.title=pilotua-frappe-public
